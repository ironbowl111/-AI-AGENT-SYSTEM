# ============================================================
# 実行パラメータ（判断基準ではなく運用上の設定）
# ============================================================

dialogue:
  budget: 20            # 1 サイクルあたりの質問数の上限（実インタビューの現実的上限）
  max_ask_per_cell: 2   # 同一セルへの追問回数の上限。空転防止
  max_ask_per_step: 3   # 同一 step への質問数の上限。
                        # これが無いと、step 数が多いとき前半だけで予算が尽き、
                        # 後半の工程に一問も届かない（35 step / 予算 20 で実測）

  # true: 作業の時間順に step を進む（映像を見ながらの振り返り向け）
  # false: step をまたいでスコア最大を優先（重要箇所だけ拾いたいとき）
  follow_step_order: true

  # 作業者の自発的発話を促す文言（研究計画 第 6 節）
  # 9/2 では作業者自身が止めて話した知識が 22/58 件（38%）を占めた。
  # 「許可」ではなく「奨励」として扱う。
  free_input:
    opening: |
      気づいたことがあれば、いつでも止めて話してください。
      作業と関係ないと思うことでも構いません。
      当たり前すぎてわざわざ言わないようなことこそ、教えてください。
    marker: "［＋ 補足があれば自由にどうぞ（空欄で次へ）］"
    on_step_change: この工程で、他に気になることはありますか。

  # 終盤に固定で置く開放質問。9/2 ではこの 1 問が枠外知識 3 件を生んだ
  closing_questions:
    - 手順書にはないけれど、こういうやり方をしているところはありますか。
    - やりにくかったところはありますか。

inheritance:
  # 前サイクルの対応付けのうち、この confidence 以上は再判定せず流用する
  alignment_confidence_reuse: 0.8

output:
  # 8 観点に収まらない知識を捨てずに置く容器
  unclassified_key: unclassified
