# ============================================================
# 【人が修正する判断基準 3/3】回答の深さ判定（3 軸）
#
#  生成側（追問するか否か）と評価側（LLM-as-a-Judge）で同じ軸を使う。
#  設計は一度だけ、使い回しは二箇所。
# ============================================================

axes:
  specificity:
    name_ja: 具体性
    question: 新人が同じ動作を再現できるだけの具体性があるか
  causality:
    name_ja: 因果関係
    question: なぜそうするのかという理由が述べられているか
  clarity:
    name_ja: 表現の明確さ
    question: 「適切に」「正常に」等の曖昧表現に逃げていないか

# 3 軸の合計がこの値以上なら「充分」とみなしセルを閉じる
sufficient_threshold: 2

# ------------------------------------------------------------
# 終止状態：causality が 0 でも「浅い」のではなく「本当に無い」場合がある。
# 9/2 のデータでは 04（順序に理由なし）06（叩く理由を知らない）が該当。
# これを見分けずに追問すると空転する。
# 該当したセルは「探索済み」として閉じ、状態を出力に残すこと。
# ------------------------------------------------------------
terminal_states:
  no_reason:
    name_ja: 理由なし
    detect: 本人が明示的に「特に理由はない」と述べている
  not_remembered:
    name_ja: 不記憶
    detect: 本人が「覚えていない」と述べている
  self_corrected:
    name_ja: 事後の自己修正
    detect: 作業時の判断を振り返りの中で本人が撤回・無効化している
